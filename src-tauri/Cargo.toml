[package]
name = "gpt-wrapper"
version = "0.1.0"
description = "Tauri wrapper for push-to-talk ChatGPT Web dictation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "unstable"] }
tauri-plugin-global-shortcut = "2"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_WinRT", "Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Devices_Radios", "Foundation", "Storage_Streams"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
sha2 = "0.10"
