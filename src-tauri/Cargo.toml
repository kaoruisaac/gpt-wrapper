[package]
name = "gpt-wrapper"
version = "0.0.6"
description = "Tauri wrapper for push-to-talk ChatGPT Web dictation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Dependencies shared by the single Rust Core on every supported OS.
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "=2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

# Windows native adapter: WebView2 COM, Win32 UI and the ESP32 device backend
# (BLE, WLAN, DPAPI, audio bridge). None of these are compiled for macOS.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
cpal = "0.15.3"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
ctr = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
roxmltree = "0.21"
aes-gcm = "0.10.3"
hkdf = "0.12"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Media_Audio",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_WinRT",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Storage_Streams",
    "Win32_NetworkManagement_WiFi",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
]

# macOS native adapter: WKWebView bridge/navigation/input and AppKit windows.
# Versions match the objc2 stack already used by tao/wry/muda.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSValue",
    "NSDate",
    "NSProcessInfo",
] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSColor",
    "NSGraphicsContext",
    "NSEvent",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSSound",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "NSPasteboard",
] }
objc2-web-kit = { version = "0.3.2", features = [
    "objc2-app-kit",
    "block2",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKSecurityOrigin",
    "WKUIDelegate",
    "WKUserContentController",
    "WKWebView",
    "WKWebViewConfiguration",
] }
